<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Zainab Hamoud!</title>
    <!-- Linking Tailwind CSS for layout utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Linking canvas-confetti library for particle celebration effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Linking custom stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main Welcome Container with the Click Button -->
    <div id="main-container" class="text-center z-10 transition-all duration-700">
        <div class="glass-card p-8 md:p-12 rounded-3xl shadow-2xl max-w-lg mx-auto transform transition-all duration-500 hover:scale-[1.02]">
            <div class="text-6xl mb-4 floating-element">🎁</div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-4 drop-shadow-md">
                A Special Surprise Awaits!
            </h1>
            <p class="text-pink-100 text-sm md:text-base mb-8 font-medium">
                Someone amazing is celebrating her special day today... Are you ready?
            </p>
            <button onclick="startCelebration()" class="glow-btn bg-white text-pink-600 font-bold px-8 py-4 rounded-full text-lg shadow-lg hover:bg-pink-50 active:scale-95 transition-all duration-300 cursor-pointer">
                Click Here ✨
            </button>
        </div>
    </div>

    <!-- Celebration Screen (Hidden Initially) -->
    <div id="celebration-screen" class="fixed inset-0 flex flex-col items-center justify-center z-20 hidden opacity-0 transition-opacity duration-1000 p-4">
        <div class="glass-card p-8 md:p-16 rounded-3xl shadow-2xl max-w-2xl mx-auto text-center border border-white/50 relative overflow-hidden">
            <!-- Decorative background glow rings -->
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-pink-300 rounded-full filter blur-xl opacity-50"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-purple-300 rounded-full filter blur-xl opacity-50"></div>

            <div class="text-6xl md:text-8xl mb-6 floating-element">🌸💖🎉</div>
            
            <h2 class="text-xl md:text-3xl font-semibold text-pink-100 tracking-wider uppercase mb-2">
                Happy Birthday
            </h2>
            <h1 class="text-3xl md:text-5xl font-extrabold text-white mb-6 drop-shadow-lg tracking-wide">
                Zainab Hamoud! 🥳🎂
            </h1>
            
            <p class="text-white/90 text-base md:text-lg leading-relaxed mb-8 font-light">
                Wishing you a year filled with boundless joy, endless laughter, and beautiful moments. May all your dreams blossom into reality! ✨
            </p>

            <button onclick="resetCelebration()" class="bg-white/20 hover:bg-white/30 text-white font-semibold px-6 py-3 rounded-full border border-white/40 transition-all duration-300 text-sm cursor-pointer">
                Play Again 🔄
            </button>
        </div>
    </div>

    <!-- Linking custom JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
